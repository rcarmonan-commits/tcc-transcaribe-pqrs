spring:
  application:
    name: pqrs-service
  profiles:
    default: dev

  datasource:
    # Sin credenciales embebidas: el despliegue las inyecta por entorno.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/transcaribe_pqrs}
    username: ${DB_USER:transcaribe}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      connection-timeout: 10000

  jpa:
    # El esquema lo gobierna Flyway. Hibernate solo valida que coincida.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: America/Bogota
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true   # rechaza campos no declarados (A08:2021)

server:
  port: ${PORT:8080}
  error:
    include-message: never               # no filtrar detalles internos al cliente
    include-stacktrace: never
    include-binding-errors: never
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: strict
  compression:
    enabled: true
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info          # superficie mínima expuesta
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:true}
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    co.edu.unicartagena.transcaribe.pqrs: INFO
    org.springframework.security: INFO

# ---------------------------------------------------------------------
# Parámetros propios de la aplicación
# ---------------------------------------------------------------------
pqrs:
  seguridad:
    jwt:
      # Obligatorio en producción. Mínimo 32 bytes para HS256.
      secreto: ${JWT_SECRET:}
      expiracion-minutos: ${JWT_EXPIRACION_MINUTOS:30}
      emisor: transcaribe-pqrs
    intentos-maximos: 5
    bloqueo-minutos: 15
    cors:
      origenes-permitidos: ${CORS_ORIGENES:http://localhost:4200}
    limite-peticiones:
      habilitado: true
      maximo-por-minuto: ${RATE_LIMIT_POR_MINUTO:60}
  radicado:
    prefijo: TC
