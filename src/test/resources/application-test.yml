# Perfil de pruebas: base H2 en memoria en modo de compatibilidad PostgreSQL.
spring:
  datasource:
    url: jdbc:h2:mem:pqrs;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/demo
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.H2Dialect

server:
  port: 0

pqrs:
  seguridad:
    jwt:
      secreto: clave-de-pruebas-hs256-con-longitud-suficiente-32
      expiracion-minutos: 10
    intentos-maximos: 3
    bloqueo-minutos: 1
    limite-peticiones:
      habilitado: false
