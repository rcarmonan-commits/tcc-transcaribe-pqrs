name: Integración continua

# El flujo corre en cada empuje a las ramas de trabajo y en cada pull
# request. Que la verificación ocurra en el servidor y no solo en la
# máquina del desarrollador es lo que convierte "en mi equipo funciona"
# en una afirmación comprobable.
on:
  push:
    branches: [main, 'feature/**', 'docs/**', 'chore/**']
  pull_request:
    branches: [main]

# Permisos mínimos: el flujo solo necesita leer el repositorio.
permissions:
  contents: read

jobs:

  pruebas:
    name: Compilación y pruebas
    runs-on: ubuntu-latest

    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Preparar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # setup-java cachea las dependencias, pero no la distribución de Maven
      # que descarga el wrapper. Sin esta cache, cada ejecución vuelve a
      # bajarla del servidor de Apache, que responde 429 cuando hay mucha
      # demanda y tumba la construcción por un motivo ajeno al código.
      - name: Cachear la distribución del wrapper de Maven
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/wrapper
            ~/.mvn/wrapper
          key: wrapper-maven-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}

      - name: Compilar y ejecutar la suite de pruebas
        run: ./mvnw -B verify

      - name: Publicar el informe de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-pruebas
          path: target/surefire-reports/
          retention-days: 14

      - name: Publicar el informe de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-cobertura-jacoco
          path: target/site/jacoco/
          retention-days: 14

  imagen:
    name: Construcción de la imagen Docker
    runs-on: ubuntu-latest
    needs: pruebas

    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Construir la imagen
        # No se publica en ningún registro: aquí solo se verifica que el
        # Dockerfile sigue construyendo. Publicar exigiría credenciales
        # y este flujo se mantiene sin secretos a propósito.
        run: docker build -t transcaribe/pqrs-service:${{ github.sha }} .

  analisis-dependencias:
    name: Análisis de dependencias vulnerables
    runs-on: ubuntu-latest
    needs: pruebas
    # Solo en la rama principal: el análisis descarga la base de datos
    # de vulnerabilidades y tarda varios minutos.
    if: github.ref == 'refs/heads/main'

    # El contexto `secrets` no está disponible en el `if` de un paso, así
    # que el secreto se expone como variable de entorno del trabajo y la
    # condición se evalúa sobre ella.
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Preparar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Ejecutar OWASP Dependency-Check
        # Requiere el secreto NVD_API_KEY configurado en el repositorio.
        # Sin él, el paso se omite en lugar de fallar el flujo entero.
        if: env.NVD_API_KEY != ''
        run: ./mvnw -B verify -Pseguridad -Dnvd.api.key="$NVD_API_KEY"

      - name: Publicar el informe de vulnerabilidades
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-dependency-check
          path: target/dependency-check-report.html
          retention-days: 30
          if-no-files-found: ignore
